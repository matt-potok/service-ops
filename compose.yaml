name: serviceops

x-api: &api
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &api-environment
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:5080
    ConnectionStrings__ServiceOps: Host=db;Database=serviceops;Username=serviceops;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: serviceops
      POSTGRES_USER: serviceops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceops -d serviceops"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    command: ["--migrate"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *api
    profiles: [tools]
    command: ["--seed"]
    environment:
      <<: *api-environment
      Seed__OperationsPassword: ${SEED_OPERATIONS_PASSWORD:-}
      Seed__ManagerPassword: ${SEED_MANAGER_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api
    ports:
      - "127.0.0.1:5080:5080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: frontend
    environment:
      API_PROXY_TARGET: http://api:5080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  node-modules:
