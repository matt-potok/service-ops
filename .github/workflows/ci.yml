name: Application checks
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_CONNECTION: Host=localhost;Database=postgres;Username=postgres;Password=ci-only-postgres
      ConnectionStrings__ServiceOps: Host=localhost;Database=postgres;Username=postgres;Password=ci-only-postgres
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore backend/ServiceOps.sln --locked-mode
      - run: dotnet build backend/ServiceOps.sln --no-restore -c Release
      - run: dotnet test backend/ServiceOps.sln --no-build -c Release
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend
      - name: Check generated API contract
        shell: bash
        run: |
          dotnet run --project backend/src/ServiceOps.Api --no-build -c Release --urls http://127.0.0.1:5080 > /tmp/serviceops-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5080/health/live; then break; fi
            sleep 1
          done
          cd frontend
          npm run api:generate
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-postgres
